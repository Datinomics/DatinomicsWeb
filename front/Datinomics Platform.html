<!doctype html>
<html lang="es">
<head>

<title>Datinomics · Plataforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="platform/styles.css" />
</head>
<body>

<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Mock data + helpers -->
<script src="platform/data.js"></script>

<!-- Charts + UI shell + views -->
<script type="text/babel" src="platform/charts.jsx"></script>
<script type="text/babel" src="platform/shell.jsx"></script>
<script type="text/babel" src="platform/explorador.jsx"></script>
<script type="text/babel" src="platform/empresa.jsx"></script>
<script type="text/babel" src="platform/views.jsx"></script>

<!-- Tweaks panel + root app (note: tweaks panel must load before app uses it) -->
<script type="text/babel" src="platform/tweaks-panel.jsx"></script>
<script type="text/babel" src="platform/app.jsx"></script>

<!-- Boot -->
<script type="text/babel">
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>

</body>
</html>
